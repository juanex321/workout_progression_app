services:
  - type: web
    name: workout-progression-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r api/requirements.txt
    startCommand: python -m uvicorn api.index:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard to your Neon connection string
      - key: PYTHON_VERSION
        value: "3.11"
